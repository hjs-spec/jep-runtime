[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jep-runtime"
version = "0.1.0"
description = "Reference runtime for Judgment Event Protocol executable accountability semantics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "JEP Runtime Contributors"}]
license = {text = "MIT"}
keywords = ["JEP", "accountability", "protocol", "runtime", "verification"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security :: Cryptography"]

[project.scripts]
jep = "jep_runtime.cli.main:main"

[tool.setuptools.packages.find]
include = ["jep_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
